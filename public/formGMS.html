<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visite GMS - Formulaire</title>
  <link rel="stylesheet" href="/css/styleFormGMS.css">
  <link rel="stylesheet" href="css/styleNavBar.css">
</head>
  
<body>
  
  <div class="form-container">
    <div class="form-header">
      <h2>📝 Rapport de Visite</h2>
      <div id="store-info-badges">
      </div>
    </div>

    <form id="visiteForm">
      <input type="hidden" id="hubspot_id" name="hubspot_id">
      <input type="hidden" id="enseigne" name="enseigne">

    <div> 
        <p id="HS-C">Contacts à consulter / mettre à jour sur <a id='huspot_link'href="">Hubspot</a></p>
    </div>
      
      <div class="form-group">
        <label>Nom du Magasin</label>
        <input type="text" id="nom_magasin" name="nom_magasin" readonly>
      </div>

      <div class="form-group">
        <label>Nb Élément Cave à Bière (historique)</label>
        <input type="number" id="nb_cave" name="nb_cave" required>
      </div>

      <div class="form-group">
        <label>Nb Élément Canettes (historique)</label>
        <input type="number" id="nb_canettes" name="nb_canettes" required>
      </div>


      <hr class="hr">
      
      <h3 style="color: #002ab6;">Références Disponibles</h3>
      <div id="references-container">
      </div>

      <hr class="hr">

      <div class="form-group">
        <label>Mise en Avant (MEA) ?</label>
        <select id="mea_status" name="mea_status" onchange="toggleMEAFields()">
          <option value="NON">NON</option>
          <option value="OUI">OUI</option>
        </select>
      </div>

      <div id="mea_details">
        <div class="form-group">
          <label>Volume Associé (hL)</label>
          <input type="number" id="mea_volume" name="mea_volume" step="any" placeholder="8CAR 75cl = 8*12*0,75/100 = 0,72HL">
        </div>
        <div class="form-group">
          <label>Photo de la MEA*</label>
          <div id="photos-mea">
            <button type="button" class="btn-pic" onclick="declencherDeclicPhoto('camera')" >
              📸 Ouvrir l'appareil
            </button>
            <button 
              type="button" class="btn-pic" onclick="declencherDeclicPhoto('galerie')">
              🖼️ Depuis la galerie
            </button>         
          </div>
          <input type="file" id="media-camera" accept="image/*" capture="environment" style="display: none;" onchange="traiterFichierPhoto(this)">
          <input type="file" id="media-galerie" accept="image/*" multiple style="display: none;" onchange="traiterFichierPhoto(this)">
          
          <div id="bloc-apercu-photo">
            <img id="image-rendu-apercu" src="">
            <p id="details-taille-photo"></p>
          </div>
        </div>
      </div>
      
      <hr class="hr">
      <h3 style="color: #002ab6;">Commentaires</h3>
      
      <div class="form-group">
        <label for="new_note">Ajouter une note </label>
        <textarea id="new_note" rows="3" placeholder="Saisissez votre note ici..." ></textarea>
        <button type="button" id="btn-save-note">Sauvegarder</button>
      </div>

      <button type="button" id="btn-view-notes">>> Voir les commentaires</button>

      <div id="notes-modal">
        <div id="note-modal-2">
            <span id="close-notes-modal">&times;</span>
            <h3>Historique des Notes</h3>
            <ul id="notes-list"></ul>
        </div>
      </div>
      
      <button type="button" class="submit-btn" onclick="soumettreFormulaire()">Envoyer le rapport</button>
    </form>
  </div>

  <script src="/js/formGMS.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async() => {
      const urlParams = new URLSearchParams(window.location.search);
      const hubspot_id = urlParams.get('id_hubspot');

      if(!hubspot_id) return ;

      try { const resConfig = await fetch('/api/config');
      const config = await resConfig.json();
      const supabase = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);
           
      const { data, error } = await supabase
        .from('historique_visites')
        .select('*')
        .eq('hubspot_id', hubspot_id)
        .single();

      if (data) {
        const inputCanettes = document.getElementById('nb_canettes');
        const inputCave = document.getElementById('nb_cave');
        if(inputCanettes) inputCanettes.value = data.nb_canettes;
        if(inputCave) inputCave.value = data.nb_cave;

        setTimeout(() => {
        if (data.references) {
          for (const [key, value] of Object.entries(data.references)) {
            const checkbox = document.querySelector(`input[name="${key}"]`);
            if (checkbox) {
              checkbox.checked = (value === "OUI");
            }
          }
        }
        }, 100);
        console.log("Historique chargé avec succès !");
      }
    } catch (err) {
      console.error("Impossible de charger l'historique :", err);
    }
  });
  </script>
  <script src="/js/noteVisite.js"></script>
</body>
</html>
