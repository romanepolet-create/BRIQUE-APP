<!DOCTYPE html>
<html lang="fr">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/styleLogin.css">
  <title>Brique App - Connexion</title>
</head>
<body >
  <div id="box">
    <h2>🍻 Brique App</h2>
    <form id="login-form">
      <input type="email" id="email" name="email"placeholder="Adresse e-mail"autocomplete="email"required>
      <input type="password" id="password" name="password"placeholder="Mot de passe" autocomplete="current-password" required>
      <button id="btn-login">Se connecter</button>
      <button type="button" id="btn-signup">Créer mon compte</button>
    </form>
    
    <p id="message"></p>
  </div>

  <script src="/js/login.js"></script>
</body>
</html>
