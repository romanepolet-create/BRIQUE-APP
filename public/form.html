<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/css/styleForm.css">
  <title>Formulaire Sales - CHR</title>
  <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#002AB6">
</head>
<body>
  <div id="nav-placeholder"></div>

  <h1>Les formulaires de commandes & PLV</h1>

  <ul class="menu-typeform">
    <li onclick="chargerFormulaire('https://briquehouse.typeform.com/to/HgMDQAeN', 'Formulaire de commande')" class="btn-form">
    📝 Formulaire de Commande
    </li>
    <li onclick="chargerFormulaire('https://briquehouse.typeform.com/commande-PLV', 'Demande de PLV')"  class="btn-form"> 
    📝Demande de PLV
    </li>
  </ul>



  <div id="message-accueil">
    <img src="/images/fontDistrib.png" alt="Іmage Sales" id="imgFontDistrib">
    <h2 id="h2MsgAccueil">👋 Bienvenue dans l'espace Sales</h2>
    <p id="pMsgAccueil">👆 Cliquez sur l'un des boutons ci-dessus pour ouvrir un formulaire.</p>
  </div>

  <div id="zone-typeform">  
    <div id="zone-typeform-2">
      <h2 id="titre-formulaire" style="margin: 0;">Chargement...</h2>
      <span id="btn-close-form" onclick="fermerFormulaire()"
        onmouseover="this.style.transform='scale(1.2)'" 
        onmouseout="this.style.transform='scale(1)'">❌</span>
    </div>

    <iframe id="iframe-typeform" src="" width="100%" frameborder="0"
     allow="camera; microphone; autoplay; encrypted-media;">
    </iframe>
  </div>

  <script src="/js/form.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then((reg) => console.log('Service worker enregistré !', reg))
        .catch((err) => console.log('Erreur Service Worker', err));
    });
  }
</script>
</body>
</html>
